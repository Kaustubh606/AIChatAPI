spring:
  application:
    name: aichatapi

  devtools:
    restart:
      enabled: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

    model:
      embedding: openai

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      qdrant:
        initialize-schema: true
        host: localhost
        port: 6334
        collection-name: eazybytes

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      stop:
        command: down

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG