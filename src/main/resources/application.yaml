spring:
  application:
    name: aichatapi
  devtools:
    restart:
      enabled: false

  ai:
    model:
      embedding: openai

    openai:
      base-url: http://localhost:12434/engines/v1
      api-key: dummy
      chat:
        model: ai/gemma3
      embedding:
        options:
          model: ai/mxbai-embed-large

    ollama:
      base-url: http://localhost:12434
      chat:
        options:
          model: ai/llama3.1

    vectorstore:
      qdrant:
        initialize-schema: true
        host: localhost
        port: 6334
        collection-name: eazybytes


  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      stop:
        command: down
