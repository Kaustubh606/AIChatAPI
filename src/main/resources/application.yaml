spring:
  application:
    name: aichatapi

  ai:
    openai:
      chat:
        model: ai/gemma3
        base-url: http://localhost:12434/engines/v1
      api-key: dummy
    ollama:
      base-url: http://localhost:12434
      chat:
        options:
          model: ai/llama3.1

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true